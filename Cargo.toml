[package]
authors = ["aminxare <amnxare@gmail.com>"]
name = "file-transfer-p2p"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
rustls-pemfile = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.9.2"
tokio-rustls = "0.26.4"

[package]
authors = ["aminxare <amnxare@gmail.com>"]
name = "file-transfer-p2p"
version = "0.1.0"
edition = "2024"

[lib]
name = "ft"
path = "./src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
rustls-pemfile = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.9.2"
tokio-rustls = "0.26.4"
x25519-dalek = "2" # for ECDH
rand_core = { version = "0.6", features = ["std"] }  # for OsRng
chrono = "0.4.42"
log = "0.4.28"
simple_logger = "5.0.0"

[dev-dependencies]
tempfile = "3.27.0"
